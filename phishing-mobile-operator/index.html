<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaTel | Авторизация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
    <div class="container">
        <header class="header">
            <!-- Заглушка для логотипа оператора -->
            <img src="logo_placeholder.png" alt="MegaTel Logo" class="logo">
            <h1>MegaTel</h1>
            <p>Ваш надежный партнер в мире связи</p>
        </header>

        <main class="form-card">
            <h2 style="margin-bottom: 25px;">Войдите в личный кабинет</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="phone">Номер телефона:</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+7 (XXX) XXX-XX-XX">
                </div>
                <div class="form-group">
                    <label for="name">Ваше Имя:</label>
                    <input type="text" id="name" name="name" required placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label for="password">Пароль / PIN:</label>
                    <input type="password" id="password" name="password" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn-login">Войти</button>
            </form>

            <!-- НОВАЯ СЕКЦИЯ: БЫСТРЫЕ ССЫЛКИ -->
            <div class="quick-links" style="margin-top: 30px;">
                <h3 style="text-align: left; color: #333; margin-bottom: 15px; font-size: 16px;">Быстрые действия</h3>
                <div class="link-grid">
                    <!-- Кнопка 1 -->
                    <a href="#balance" class="quick-btn btn-primary">Пополнить баланс</a>
                    <!-- Кнопка 2 -->
                    <a href="#tariff" class="quick-btn btn-secondary">Проверить тариф</a>
                    <!-- Кнопка 3 -->
                    <a href="#history" class="quick-btn btn-tertiary">История списаний</a>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 MegaTel. Все права защищены.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
